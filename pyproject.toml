[project]
name = "snip"
description = "A simple snippet tool"
readme = "README.md"
authors = [
    { name = "Hai Vu", email = "haivu2004@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "minja",
]
version = "1.0.0"

[project.scripts]
snip = "snip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flake8>=7.1.1",
    "hatchling>=1.26.3",
    "pytest>=8.3.4",
    "pytest-pythonpath>=0.7.3",
    "ruff>=0.8.2",
]

